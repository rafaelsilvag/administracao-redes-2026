services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: meuprojeto
      DB_USER: aluno
      DB_PASSWORD: senha_didatica
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    ports:
      - "8001:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_didatica
      MYSQL_DATABASE: meuprojeto
      MYSQL_USER: aluno
      MYSQL_PASSWORD: senha_didatica
    volumes:
      - dados_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  dados_mysql:
