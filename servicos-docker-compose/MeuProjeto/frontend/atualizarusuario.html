<!DOCTYPE html>

<html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Atualizar Usuário</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 0;
    }

    .container {
        width: 400px;
        margin: 60px auto;
        padding: 25px;
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 0 10px #ccc;
    }

    h2 {
        text-align: center;
        color: #333;
    }

    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
    }

    input, select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background-color: #0056b3;
    }

    #mensagem {
        text-align: center;
        margin-top: 15px;
        font-weight: bold;
    }
</style>


</head>

<body>

<div class="container">

    <h2>Atualizar Usuário</h2>

    <label for="usuario">Selecione o usuário:</label>
    <select id="usuario">
        <option value="">Carregando usuários...</option>
    </select>

    <label for="nome">Novo nome:</label>
    <input type="text" id="nome" placeholder="Digite o novo nome">

    <label for="senha">Nova senha:</label>
    <input type="password" id="senha" placeholder="Digite a nova senha">

    <button onclick="atualizarUsuario()">Atualizar Usuário</button>

    <p id="mensagem"></p>

</div>

<script>

    const API_URL = "http://127.0.0.1:8000/usuarios";

    let usuarios = [];

    // Consultar usuários através do método GET
    async function carregarUsuarios() {

        const mensagem = document.getElementById("mensagem");

        try {

            const resposta = await fetch(API_URL);

            if (!resposta.ok) {
                throw new Error("Erro ao consultar usuários.");
            }

            usuarios = await resposta.json();

            const select = document.getElementById("usuario");

            select.innerHTML = '<option value="">Selecione um usuário</option>';

            usuarios.forEach((usuario, index) => {

                const opcao = document.createElement("option");

                // O ID corresponde à posição do usuário na lista
                opcao.value = index;

                opcao.textContent = usuario.nome;

                select.appendChild(opcao);

            });

        } catch (erro) {

            mensagem.style.color = "red";
            mensagem.textContent = erro.message;

        }

    }


    // Atualizar usuário através do método PUT
    async function atualizarUsuario() {

        const usuarioId = document.getElementById("usuario").value;

        const novoNome = document.getElementById("nome").value;

        const novaSenha = document.getElementById("senha").value;

        const mensagem = document.getElementById("mensagem");

        if (usuarioId === "") {

            mensagem.style.color = "red";
            mensagem.textContent = "Selecione um usuário.";

            return;

        }

        if (novoNome === "" || novaSenha === "") {

            mensagem.style.color = "red";
            mensagem.textContent = "Preencha todos os campos.";

            return;

        }

        try {

            const resposta = await fetch(`${API_URL}/${usuarioId}`, {

                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    nome: novoNome,
                    senha: novaSenha
                })

            });

            if (!resposta.ok) {
                throw new Error("Erro ao atualizar usuário.");
            }

            mensagem.style.color = "green";
            mensagem.textContent = "Usuário atualizado com sucesso!";

            // Limpar os campos
            document.getElementById("nome").value = "";
            document.getElementById("senha").value = "";

            // Atualizar a lista de usuários
            carregarUsuarios();

        } catch (erro) {

            mensagem.style.color = "red";
            mensagem.textContent = erro.message;

        }

    }


    // Carregar usuários assim que a página for aberta
    carregarUsuarios();

</script>
</body> </html>
