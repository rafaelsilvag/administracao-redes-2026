<!DOCTYPE html>

<html lang="pt-BR">

<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deletar Usuário</title>

<style>

    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 0;
    }

    .container {
        width: 400px;
        margin: 60px auto;
        padding: 25px;
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 0 10px #ccc;
    }

    h2 {
        text-align: center;
        color: #333;
    }

    label {
        display: block;
        margin-top: 20px;
        font-weight: bold;
    }

    select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 20px;
        background-color: #dc3545;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background-color: #a71d2a;
    }

    #mensagem {
        text-align: center;
        margin-top: 15px;
        font-weight: bold;
    }

</style>


</head>

<body>

<div class="container">

    <h2>Deletar Usuário</h2>

    <label for="usuario">Selecione o usuário:</label>

    <select id="usuario">
        <option value="">Carregando usuários...</option>
    </select>

    <button onclick="deletarUsuario()">
        Deletar Usuário
    </button>

    <p id="mensagem"></p>

</div>


<script>

    const API_URL = "http://127.0.0.1:8000/usuarios";

    let usuarios = [];


    // Consultar usuários através do método GET
    async function carregarUsuarios() {

        const mensagem = document.getElementById("mensagem");

        try {

            const resposta = await fetch(API_URL);

            if (!resposta.ok) {
                throw new Error("Erro ao consultar usuários.");
            }

            usuarios = await resposta.json();

            const select = document.getElementById("usuario");

            select.innerHTML = '<option value="">Selecione um usuário</option>';

            usuarios.forEach((usuario, index) => {

                const opcao = document.createElement("option");

                // O ID corresponde à posição do usuário na lista
                opcao.value = index;

                opcao.textContent = usuario.nome;

                select.appendChild(opcao);

            });

        } catch (erro) {

            mensagem.style.color = "red";
            mensagem.textContent = erro.message;

        }

    }


    // Deletar usuário através do método DELETE
    async function deletarUsuario() {

        const usuarioId = document.getElementById("usuario").value;

        const mensagem = document.getElementById("mensagem");

        if (usuarioId === "") {

            mensagem.style.color = "red";
            mensagem.textContent = "Selecione um usuário para deletar.";

            return;

        }

        // Solicitar confirmação antes de deletar
        const confirmar = confirm("Deseja realmente deletar este usuário?");

        if (!confirmar) {
            return;
        }

        try {

            const resposta = await fetch(`${API_URL}/${usuarioId}`, {

                method: "DELETE"

            });

            if (!resposta.ok) {
                throw new Error("Erro ao deletar usuário.");
            }

            mensagem.style.color = "green";
            mensagem.textContent = "Usuário deletado com sucesso!";

            // Atualizar a lista de usuários
            await carregarUsuarios();

        } catch (erro) {

            mensagem.style.color = "red";
            mensagem.textContent = erro.message;

        }

    }


    // Carregar usuários assim que a página for aberta
    carregarUsuarios();

</script>


</body>

</html>
