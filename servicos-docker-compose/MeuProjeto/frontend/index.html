<!DOCTYPE html>

<html lang="pt-BR">

<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema de Gerenciamento de Usuários</title>

<style>

    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 0;
    }

    header {
        background-color: #007bff;
        color: white;
        text-align: center;
        padding: 25px;
    }

    .container {
        width: 400px;
        margin: 60px auto;
        padding: 30px;
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 0 10px #ccc;
        text-align: center;
    }

    h2 {
        color: #333;
        margin-bottom: 25px;
    }

    .botao {
        display: block;
        width: 100%;
        padding: 15px;
        margin-top: 15px;
        box-sizing: border-box;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-size: 16px;
        transition: 0.3s;
    }

    .cadastrar {
        background-color: #28a745;
    }

    .listar {
        background-color: #007bff;
    }

    .atualizar {
        background-color: #ffc107;
        color: #333;
    }

    .deletar {
        background-color: #dc3545;
    }

    .botao:hover {
        opacity: 0.8;
    }

    footer {
        text-align: center;
        margin-top: 30px;
        color: #777;
    }

</style>


</head>

<body>

<header>

    <h1>Sistema de Gerenciamento de Usuários</h1>

    <p>Bem-vindo ao sistema!</p>

</header>


<div class="container">

    <h2>Menu Principal</h2>

    <a href="usuarios.html" class="botao cadastrar">
        Cadastrar Usuário
    </a>

    <a href="listarusuarios.html" class="botao listar">
        Listar Usuários
    </a>

    <a href="atualizarusuario.html" class="botao atualizar">
        Atualizar Usuário
    </a>

    <a href="deletarusuario.html" class="botao deletar">
        Deletar Usuário
    </a>

</div>


<footer>

    <p>Sistema de Gerenciamento de Usuários</p>

</footer>


</body>

</html>
